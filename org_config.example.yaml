# Copy this file to org_config.yaml and fill in your org-specific values.
# org_config.yaml is gitignored — never commit real connection details.

org:
  name: "Example Health System"

# LLM endpoint for description generation (notebook 07) — REQUIRED.
# Your own Azure OpenAI resource; see INSTALLATION_GUIDE.md Step 3f.
# llm:
#   endpoint: https://<your-resource>.openai.azure.com/openai/deployments/<deployment-name>
#   model: <deployment-name>            # e.g. gpt-5.4-mini
#   api_key_file: llm_api_key.txt      # next to this file; raw key, one line

# Fabric lakehouse paths for Delta tables
lakehouse:
  # Input tables (customer data)
  dict_tables: "input_dict_tables"
  dict_columns: "input_dict_columns"
  sql_sources: "input_sql_sources"

  # Graph tables (built by pipeline)
  graph_nodes: "graph_nodes"
  graph_edges: "graph_edges"

# Data dictionary source (optional overrides)
dictionary:
  # If your org uses a non-standard schema for dict_tables / dict_columns,
  # map column names here.
  table_name_col: "TABLE_NAME"
  column_name_col: "COLUMN_NAME"
  description_col: "DESCRIPTION"
  # Dictionary matching is schema-agnostic. If 06_validate detects the same
  # bare table name in multiple schemas, deployment blocks until you either
  # resolve it or acknowledge it here (the shared description then attaches
  # to every schema's table with that name).
  accept_schema_ambiguity: false

# Search index (notebook 11) — Eventhouse + embeddings endpoints
# search:
#   kusto_uri: "https://<your-eventhouse>.kusto.fabric.microsoft.com"  # KQL database page -> Query URI
#   kusto_db: "<your-kql-database>"
#   embed_endpoint: "https://<your-resource>.openai.azure.com/openai/deployments/<embed-deployment>/embeddings?api-version=2024-06-01"

# Automated extraction — the primary ingestion path (procs AND views).
# Pick ONE source_type; see INSTALLATION_GUIDE "Automated extraction".
# extractor:
#   sql_server:
#     host: "your-sql-server.corp.local"   # or Azure SQL / Fabric SQL endpoint
#     port: 1433
#     database: "YourDatabase"
#     source_type: "onprem_gateway"   # onprem_gateway | azure_direct | fabric_native
#     gateway_connection_name: "OnPremSQLGateway"  # onprem_gateway only
#     driver: "ODBC Driver 17 for SQL Server"       # token/local profiles
#     trusted_connection: true                       # local dev only
#   domain:
#     schemas: ["dbo", "reporting"]
#     base_tables: ["encounter", "patient"]
#     object_types: ["VIEW", "SQL_STORED_PROCEDURE"]   # the default
#   tracking_table: "ops_extraction_tracking"

# PBI semantic models (optional — report lineage, DAX measures, business
# names; ADR 0040). Pick ONE source profile.
# semantic_models:
#   source_type: "workspace"     # workspace | folder | devops_git
#   workspace_ids: []            # several workspaces, ONE pass; order =
#                                # naming priority for shared metrics
#   workspace_id: ""             # single-workspace sugar; empty = current
#   folder_path: "/lakehouse/default/Files/semantic-models"   # folder profile
#   devops:                      # devops_git profile
#     org: "YourDevOpsOrg"
#     project: "Your Project"
#     repo: "BI-Reports"
#     key_vault_url: "https://your-vault.vault.azure.net/"    # PAT lives HERE,
#     pat_secret_name: "devops-pat"                           # never in config

# Fabric Graph (optional — enable to use native graph backend alongside Delta)
