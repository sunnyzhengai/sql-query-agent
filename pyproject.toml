[project]
name = "aivia-sql-intelligence"
version = "1.0.0"
description = "AIVIA — SQL Intelligence Agent for Microsoft Fabric. Extract business logic from SQL, build knowledge graphs, answer questions in plain English."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AIVIA LLC", email = "founder@aiviaapp.com"},
]
dependencies = [
    "pyyaml==6.0.1",
    "pydantic==2.5.0",
    "sqlglot==19.7.0",
    "sqlparse==0.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "ruff==0.1.9",
    "build",
    "twine",
]
adapters = [
    "requests==2.31.0",
    "azure-identity==1.15.0",
]
fabric = [
    # Fabric notebooks provide these; listed for documentation only
    # "pyspark",
    # "delta-spark",
    # "pythonnet",
]

[project.urls]
Homepage = "https://www.aiviaapp.com"
Repository = "https://github.com/sunnyzhengai/sql-query-agent"
Documentation = "https://www.aiviaapp.com"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N818", "N806"]  # Allow exception names without Error suffix and uppercase vars in functions
