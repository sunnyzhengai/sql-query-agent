[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-query-agent"
version = "2.5.0"
description = "SQL Intelligence Agent for Microsoft Fabric. Extract business logic from SQL, build knowledge graphs, answer questions in plain English."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Sunny Zheng"},
]
dependencies = [
    # Brief_Fabric_Resident FR6 (2026-09-19): the 2.0.0 wheel packages
    # the aisql engine, whose ONLY third-party import is pythonnet —
    # verified against every import in aisql/. pyyaml/pydantic served
    # the retired 1.x src/ tree and moved to the dev extra (the CI
    # suite still exercises src/).
    # Native-parser law (ADR 0001, hardened 2026-08-19): ScriptDom via
    # pythonnet is the ONLY parser; sqlglot/sqlparse are banned (see
    # tests/test_native_parser_law.py).
    "pythonnet>=3.0.1",
]

[project.optional-dependencies]
dev = [
    # Toolchain contract (ruled 2026-08-19, tests/test_toolchain_contract.py):
    # every tool that can fail CI is pinned EXACTLY — unpinned ruff cost
    # three lint-only CI failures in one day; floors resolve differently
    # on CI than on dev machines by construction.
    # Exact per-interpreter pins: pytest 9 requires >=3.10; the CI
    # matrix still tests 3.9 (Fabric floor), so each leg gets its own
    # exact pin — still no floors anywhere.
    "pytest==9.1.1; python_version >= '3.10'",
    "pytest==8.4.2; python_version < '3.10'",
    "pytest-cov==7.1.0; python_version >= '3.10'",
    "pytest-cov==6.2.1; python_version < '3.10'",
    # Pinned exactly: CI resolves this fresh while dev machines lag —
    # unpinned ruff produced three lint-only CI failures in one day
    # (2026-08-19; isort grouping changed across versions)
    "ruff==0.16.3",
    # Slice 0 (2026-09-05): tests/aisql rerun the registry converter to
    # prove determinism; the converter reads the design xlsx workbooks
    "openpyxl==3.1.5",
    # M1 (2026-09-09): the graph export ships PARQUET — Fabric's
    # Load-to-Tables mis-parsed standard CSV quote-escaping (the
    # missing-86 corpse); pyarrow writes it. Dual pin: the CI
    # matrix still tests the 3.9 Fabric floor.
    "pyarrow==25.0.1; python_version >= '3.10'",
    "pyarrow==17.0.0; python_version < '3.10'",
    "build==1.5.0; python_version >= '3.10'",
    "build==1.4.4; python_version < '3.10'",
    # F15 (2026-09-21): build_wheel runs `python -m build
    # --no-isolation`, so the [build-system] requires above must
    # PRE-EXIST in the env — CI's fresh `pip install -e .[dev]`
    # had no `wheel` and all three wheel-boot pins errored
    # ("Missing dependencies: wheel"); local machines had it by
    # accident. Both requires ride here, pinned exactly; the
    # wheel-boot pin test_build_requires_ride_the_dev_extras
    # keeps the set complete. setuptools 81+ needs >=3.10, so
    # the 3.9 Fabric-floor leg gets its own exact pin.
    "wheel==0.47.0",
    "setuptools==83.0.0; python_version >= '3.10'",
    "setuptools==80.9.0; python_version < '3.10'",
    # FR6: the old-era src/ tree left the wheel but its tests still
    # run in CI — its two imports ride here now, not in the product
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "requests>=2.31.0",  # tests/adapters imports the adapters; keep in sync with [adapters]
    "fastapi>=0.110",    # tests/webapp imports the webapp surface; keep in sync with [webapp]
    "httpx>=0.27",       # fastapi.testclient's transport
]
adapters = [
    "requests>=2.31.0",
    "azure-identity>=1.15.0",
]
webapp = [
    # The workbench/chat surface (src/webapp) served on App Service
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
marketplace = [
    # marketplace_host: SaaS Fulfillment webhook + Entra token validation
    "pyjwt[crypto]>=2.8",
    "requests>=2.31.0",
]

[project.urls]
Repository = "https://github.com/sunnyzhengai/sql-query-agent"

[tool.setuptools.packages.find]
# FR6: the wheel ships the aisql engine; the 1.x line packaged the
# retired src/ tree
include = ["aisql", "aisql.*"]
exclude = ["tests", "tests.*", "scripts", "notebooks", "docs", "data", "build"]

[tool.setuptools.package-data]
# FR1 all-in-one: the 7 registry JSONs + the ScriptDom DLL ride in
# the wheel (build_wheel.py copies them in at build; never tracked)
aisql = ["_registries/*.json", "_libs/*.dll",
         "_source_packs/clarity/*.sql",
         # Brief_Pilot_Build_1 ruling (5): the pack's vendor facts
         # (default_schema -> the estate manifest template)
         "_source_packs/clarity/pack.json"]
# 2.1.1 field fix (Sunny's Fabric run, 2026-09-19): the flows
# subpackage carries its own data files — code never ships
# without its data (the wheel pin now enumerates the class)
"aisql.flows" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "AIVIA_Test"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 120
# Fabric injects these into the notebook runtime; they exist at execution time
builtins = ["spark", "mssparkutils", "notebookutils", "display"]

[tool.ruff.lint]
# BLE001/S110/S112 enforce the silence contract: a broad `except` is illegal
# unless annotated with the policy that justifies it (see steps/parse.py:71).
# Undeclared silence is a build failure (audit 2026-08-15).
select = ["E", "F", "I", "N", "W", "BLE", "S110", "S112"]
ignore = ["N818", "N806"]

[tool.ruff.lint.per-file-ignores]
# TMDL fixture strings must stay byte-exact; long lines are the fixtures
"tests/adapters/test_devops_tmdl.py" = ["E501"]
# Notebook cells import where the cell needs them, not at file top
"*.Notebook/notebook-content.py" = ["E402"]
"notebooks/**/*.py" = ["E402"]
# Scripts insert the project root on sys.path before importing src
"scripts/*.py" = ["E402"]
# Anonymized description strings are data; keep them one-per-line
"scripts/anonymize_dictionary.py" = ["E501"]
