[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-query-agent"
version = "1.1.0"
description = "SQL Intelligence Agent for Microsoft Fabric. Extract business logic from SQL, build knowledge graphs, answer questions in plain English."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Sunny Zheng"},
]
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "sqlglot>=19.7.0",
    "sqlparse>=0.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "build",
]
adapters = [
    "requests>=2.31.0",
    "azure-identity>=1.15.0",
]

[project.urls]
Repository = "https://github.com/sunnyzhengai/sql-query-agent"

[tool.setuptools.packages.find]
include = ["src", "src.*"]
exclude = ["tests", "tests.*", "scripts", "notebooks", "docs", "data", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N818", "N806"]
