[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-query-agent"
version = "1.68.0"
description = "SQL Intelligence Agent for Microsoft Fabric. Extract business logic from SQL, build knowledge graphs, answer questions in plain English."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Sunny Zheng"},
]
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    # Native-parser law (ADR 0001, hardened 2026-08-19): ScriptDom via
    # pythonnet is the ONLY parser; sqlglot/sqlparse are banned (see
    # tests/test_native_parser_law.py).
    "pythonnet>=3.0.1",
]

[project.optional-dependencies]
dev = [
    # Toolchain contract (ruled 2026-08-19, tests/test_toolchain_contract.py):
    # every tool that can fail CI is pinned EXACTLY — unpinned ruff cost
    # three lint-only CI failures in one day; floors resolve differently
    # on CI than on dev machines by construction.
    # Exact per-interpreter pins: pytest 9 requires >=3.10; the CI
    # matrix still tests 3.9 (Fabric floor), so each leg gets its own
    # exact pin — still no floors anywhere.
    "pytest==9.1.1; python_version >= '3.10'",
    "pytest==8.4.2; python_version < '3.10'",
    "pytest-cov==7.1.0; python_version >= '3.10'",
    "pytest-cov==6.2.1; python_version < '3.10'",
    # Pinned exactly: CI resolves this fresh while dev machines lag —
    # unpinned ruff produced three lint-only CI failures in one day
    # (2026-08-19; isort grouping changed across versions)
    "ruff==0.16.3",
    "build==1.5.0; python_version >= '3.10'",
    "build==1.4.4; python_version < '3.10'",
    "requests>=2.31.0",  # tests/adapters imports the adapters; keep in sync with [adapters]
    "fastapi>=0.110",    # tests/webapp imports the webapp surface; keep in sync with [webapp]
    "httpx>=0.27",       # fastapi.testclient's transport
]
adapters = [
    "requests>=2.31.0",
    "azure-identity>=1.15.0",
]
webapp = [
    # The workbench/chat surface (src/webapp) served on App Service
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
marketplace = [
    # marketplace_host: SaaS Fulfillment webhook + Entra token validation
    "pyjwt[crypto]>=2.8",
    "requests>=2.31.0",
]

[project.urls]
Repository = "https://github.com/sunnyzhengai/sql-query-agent"

[tool.setuptools.packages.find]
include = ["src", "src.*"]
exclude = ["tests", "tests.*", "scripts", "notebooks", "docs", "data", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 120
# Fabric injects these into the notebook runtime; they exist at execution time
builtins = ["spark", "mssparkutils", "notebookutils", "display"]

[tool.ruff.lint]
# BLE001/S110/S112 enforce the silence contract: a broad `except` is illegal
# unless annotated with the policy that justifies it (see steps/parse.py:71).
# Undeclared silence is a build failure (audit 2026-08-15).
select = ["E", "F", "I", "N", "W", "BLE", "S110", "S112"]
ignore = ["N818", "N806"]

[tool.ruff.lint.per-file-ignores]
# TMDL fixture strings must stay byte-exact; long lines are the fixtures
"tests/adapters/test_devops_tmdl.py" = ["E501"]
# Notebook cells import where the cell needs them, not at file top
"*.Notebook/notebook-content.py" = ["E402"]
"notebooks/**/*.py" = ["E402"]
# Scripts insert the project root on sys.path before importing src
"scripts/*.py" = ["E402"]
# Anonymized description strings are data; keep them one-per-line
"scripts/anonymize_dictionary.py" = ["E501"]
