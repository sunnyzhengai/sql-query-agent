name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (pinned to production versions)
        run: |
          python -m pip install --upgrade pip
          # Constrain to the exact versions the Fabric Environment pins —
          # CI must test the parser the product actually runs, not latest.
          pip install -e ".[dev]" -c environment/requirements.txt

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: TEMP debug golden parse divergence
        run: |
          python -c "
          import sqlglot, sqlparse, sys
          print('py', sys.version)
          print('sqlglot', sqlglot.__version__, 'sqlparse', sqlparse.__version__)
          raw = open('data/synthetic/sql/reporting/USP_IP_SEPSIS.sql', 'rb').read()
          print('bytes', len(raw), 'CR count', raw.count(b'\r'), 'first60', raw[:60])
          from src.parser.sql_parser import parse_sql
          parsed = parse_sql(raw.decode('utf-8-sig'))
          print('CTE count:', len(parsed.ctes))
          print('cte names first 5:', [c.name for c in parsed.ctes[:5]])
          "

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Detect dead code
        run: |
          python scripts/detect_dead_code.py

      - name: Check packaging
        run: |
          pip install build twine
          python -m build --wheel
          twine check dist/*

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (pinned to production versions)
        run: |
          python -m pip install --upgrade pip
          # Constrain to the exact versions the Fabric Environment pins —
          # CI must test the parser the product actually runs, not latest.
          pip install -e ".[dev]" -c environment/requirements.txt
          pip install pip-audit

      - name: Audit dependencies
        run: |
          pip-audit --requirement <(pip freeze | grep -E "^(pyyaml|pydantic|sqlglot)==")
