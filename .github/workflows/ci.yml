name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Native-parser law (ADR 0001, hardened 2026-08-19): ScriptDom via
      # pythonnet is the ONLY parser, so CI hosts the .NET runtime too —
      # the same parse everywhere; no fallback grammar exists.
      - name: Set up .NET runtime (ScriptDom host)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies (pinned to production versions)
        run: |
          python -m pip install --upgrade pip
          # Constrain to the exact versions the Fabric Environment pins —
          # CI must test the parser the product actually runs, not latest.
          pip install -e ".[dev]" -c environment/requirements.txt

      - name: Lint with ruff
        run: |
          # Everything: production notebooks live in *.Notebook/, and unlinted
          # notebooks/scripts once hid a 100%-broken MERGE (audit 2026-08-15)
          ruff check src/ tests/ notebooks/ scripts/ devtools/ ./*.Notebook/

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Detect dead code
        run: |
          python scripts/detect_dead_code.py

      - name: Check packaging
        run: |
          pip install build twine
          python -m build --wheel
          twine check dist/*

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (pinned to production versions)
        run: |
          python -m pip install --upgrade pip
          # Constrain to the exact versions the Fabric Environment pins —
          # CI must test the parser the product actually runs, not latest.
          pip install -e ".[dev]" -c environment/requirements.txt
          pip install pip-audit

      - name: Audit dependencies
        run: |
          pip-audit --requirement <(pip freeze | grep -E "^(pyyaml|pydantic|sqlglot)==")
