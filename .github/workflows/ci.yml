name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (pinned to production versions)
        run: |
          python -m pip install --upgrade pip
          # Constrain to the exact versions the Fabric Environment pins —
          # CI must test the parser the product actually runs, not latest.
          pip install -e ".[dev]" -c environment/requirements.txt

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: TEMP debug golden parse divergence
        run: |
          python -c "
          import logging
          logging.basicConfig(level=logging.INFO)
          sql = open('data/synthetic/sql/reporting/USP_IP_SEPSIS.sql', encoding='utf-8-sig').read()
          from src.parser.sql_extractor import extract_queries
          queries = extract_queries(sql)
          print('SPLIT: extract_queries ->', len(queries), 'queries')
          for q in queries[:3]:
              print('  q:', repr(q[:70]))
          from src.parser.sql_parser import parse_sql
          parsed = parse_sql(sql)
          print('FULL: parse_sql ->', len(parsed.ctes), 'CTEs')
          "

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Detect dead code
        run: |
          python scripts/detect_dead_code.py

      - name: Check packaging
        run: |
          pip install build twine
          python -m build --wheel
          twine check dist/*

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (pinned to production versions)
        run: |
          python -m pip install --upgrade pip
          # Constrain to the exact versions the Fabric Environment pins —
          # CI must test the parser the product actually runs, not latest.
          pip install -e ".[dev]" -c environment/requirements.txt
          pip install pip-audit

      - name: Audit dependencies
        run: |
          pip-audit --requirement <(pip freeze | grep -E "^(pyyaml|pydantic|sqlglot)==")
